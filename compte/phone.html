<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atherion XR • Mail + Visio + VR</title>
    <meta name="theme-color" content="#00ffff">
    <link rel="manifest" href="data:application/manifest+json,{
      \"name\":\"Atherion XR\",
      \"short_name\":\"Atherion\",
      \"start_url\":\".\",
      \"display\":\"standalone\",
      \"background_color\":\"#000\",
      \"theme_color\":\"#00ffff\",
      \"icons\":[{\"src\":\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>A</text></svg>\",\"sizes\":\"192x192\",\"type\":\"image/svg+xml\"}]
    }">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <style>
        :root {
            --bg: #000814;
            --primary: #00ffff;
            --accent: #ff00ff;
            --glass: rgba(10,20,50,0.7);
            --text: #e0faff;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            image-rendering: pixelated;
        }
        canvas { position: fixed; top:0; left:0; z-index:-1; }
        .matrix { position: fixed; inset:0; pointer-events:none; opacity:0.15; background: linear-gradient(transparent 50%, #00ffff 50%); background-size: 100% 4px; animation: rain 8s linear infinite; }
        @keyframes rain { from { background-position: 0 0; } to { background-position: 0 1000px; } }

        .container { padding: 20px; height: 100dvh; display: flex; flex-direction: column; }
        .header {
            text-align: center;
            padding: 30px;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px var(--primary);
        }
        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            margin: 12px 0;
            border: 1px solid var(--primary);
            box-shadow: 0 0 40px rgba(0,255,255,0.3);
        }
        input, button, textarea {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border-radius: 16px;
            border: 2px solid var(--primary);
            background: transparent;
            color: white;
            font-size: 18px;
        }
        button {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--primary); }
        .hidden { display: none; }
        video { width: 100%; border-radius: 20px; border: 3px solid var(--primary); box-shadow: 0 0 40px var(--primary); margin: 10px 0; }
        #xr-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 40px;
            font-size: 24px;
            z-index: 9999;
        }
    </style>
</head>
<body>

<div class="matrix"></div>
<canvas id="bg"></canvas>

<div class="container">
    <h1 class="header">ATHERION XR</h1>

    <!-- LOGIN -->
    <div id="login" class="card">
        <h2>Connexion / Inscription</h2>
        <input type="text" id="username" placeholder="Ton pseudo (ex: neo)">
        <input type="password" id="password" placeholder="Mot de passe">
        <button onclick="login()">ENTRER DANS LA MATRICE</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
        <h2>Bienvenue, <span id="userDisplay"></span></h2>

        <!-- MAIL SYSTEM -->
        <div class="card">
            <h3>Envoyer un Mail Cybernétique</h3>
            <input type="text" id="to" placeholder="Destinataire">
            <input type="text" id="subject" placeholder="Sujet">
            <textarea id="body" rows="4" placeholder="Ton message..."></textarea>
            <button onclick="sendMail()">ENVOYER</button>
        </div>

        <div class="card">
            <h3>Boîte de Réception (<span id="mailCount">0</span>)</h3>
            <div id="inbox"></div>
        </div>

        <!-- VISIO WEBRTC -->
        <div class="card">
            <h3>Visio Ultra HD</h3>
            <input type="text" id="callUser" placeholder="Pseudo à appeler">
            <button onclick="startCall()">APPELER</button>
            <button onclick="hangUp()">RACCROCHER</button>
            <div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:20px;">
                <video id="localVideo" autoplay muted playsinline></video>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>

        <!-- WEBXR VR MODE -->
        <button id="xr-button" onclick="enterVR()">ENTRER EN RÉALITÉ VIRTUELLE (WebXR)</button>
    </div>
</div>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script>
// === VARIABLES GLOBALES ===
let currentUser = '';
let socket;
let localStream;
let pc;
let mails = JSON.parse(localStorage.getItem('atherion_mails') || '[]');
const peers = {};

// === BACKGROUND MATRIX 3D ===
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const matrix = "アカサタナハマヤラワガザダバパイキシチニヒミリヰギジヂビピウクステノフムユルグズデブプエケセネヘメレヱゲゼベペオコソトホモヨロヲゴゾドボポヴッン";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 8, 20, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ffff';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
        const text = matrix[Math.floor(Math.random() * matrix.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 35);

// === LOGIN SYSTEM ===
async function login() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;

    if (!user || !pass) return alert('Remplis tout morray');

    currentUser = user;
    document.getElementById('userDisplay').textContent = user;
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');

    // Sauvegarde locale
    localStorage.setItem('atherion_user', user);

    // Connexion Socket.IO (mode local ou serveur)
    try {
        socket = io('https://atherion-socket.glitch.me'); // Serveur gratuit toujours en ligne
    } catch {
        socket = io(); // mode local
    }

    socket.emit('register', user);
    loadMails();
}

// Charger mails
function loadMails() {
    const inbox = document.getElementById('inbox');
    const myMails = mails.filter(m => m.to === currentUser);
    document.getElementById('mailCount').textContent = myMails.length;

    inbox.innerHTML = myMails.map(m => `
        <div style="background:rgba(0,255,255,0.1); padding:16px; margin:8px 0; border-radius:16px; border-left:4px solid var(--primary);">
            <b>De:</b> ${m.from}<br>
            <b>Sujet:</b> ${m.subject}<br>
            ${m.body}
            <small style="float:right">${new Date(m.time).toLocaleString()}</small>
        </div>
    `).join('') || '<i>Aucun message... pour l\'instant</i>';
}

// Envoyer mail
function sendMail() {
    const to = document.getElementById('to').value;
    const subject = document.getElementById('subject').value;
    const body = document.getElementById('body').value;

    if (!to || !subject || !body) return alert('Remplis tout');

    const mail = { from: currentUser, to, subject, body, time: Date.now() };
    mails.push(mail);
    localStorage.setItem('atherion_mails', JSON.stringify(mails));

    // Envoi via socket si serveur dispo
    if (socket) socket.emit('mail', mail);

    alert('Message envoyé dans la Matrice !');
    document.getElementById('to').value = document.getElementById('subject').value = document.getElementById('body').value = '';
    loadMails();
}

// === VISIO WEBRTC PUISSANTE ===
const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

async function startCall() {
    const target = document.getElementById('callUser').value;
    if (!target) return alert('Qui tu veux appeler ?');

    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = localStream;

    pc = new RTCPeerConnection(config);
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.ontrack = e => {
        document.getElementById('remoteVideo').srcObject = e.streams[0];
    };

    pc.onicecandidate = e => {
        if (e.candidate && socket) {
            socket.emit('ice', { candidate: e.candidate, to: target });
        }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('call', { offer, to: target, from: currentUser });
}

function hangUp() {
    if (pc) pc.close();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    document.getElementById('localVideo').srcObject = null;
    document.getElementById('remoteVideo').srcObject = null;
}

// Réception d'appel
socket?.on('call', async ({ offer, from }) => {
    if (confirm(`${from} t'appelle en visio ! Accepter ?`)) {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;

        pc = new RTCPeerConnection(config);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];

        await pc.setRemoteDescription(offer);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit('answer', { answer, to: from });
    }
});

socket?.on('answer', ({ answer }) => {
    pc.setRemoteDescription(answer);
});

socket?.on('ice', ({ candidate }) => {
    if (pc) pc.addIceCandidate(candidate);
});

// === MODE WEBXR TOTAL IMMERSION ===
function enterVR() {
    const scene = document.createElement('a-scene');
    scene.setAttribute('background', 'color: #000');
    scene.setAttribute('embedded', '');
    scene.setAttribute('vr-mode-ui', 'enabled: true');

    // Avatar local
    const player = document.createElement('a-box');
    player.setAttribute('position', '0 1.6 -3');
    player.setAttribute('color', '#00ffff');
    scene.appendChild(player);

    // Salle cyberpunk
    const room = document.createElement('a-cylinder');
    room.setAttribute('radius', '20');
    room.setAttribute('height', '10');
    room.setAttribute('color', '#001122');
    room.setAttribute('material', 'metalness: 0.8; roughness: 0.2');
    scene.appendChild(room);

    // Texte flottant
    const text = document.createElement('a-text');
    text.setAttribute('value', `Bienvenue dans la Matrice,\n${currentUser}`);
    text.setAttribute('position', '0 3 -5');
    text.setAttribute('color', '#00ffff');
    text.setAttribute('align', 'center');
    text.setAttribute('shader', 'msdf');
    scene.appendChild(text);

    document.body.appendChild(scene);
    scene.enterVR();
}

// Auto-login si déjà connecté
if (localStorage.getItem('atherion_user')) {
    currentUser = localStorage.getItem('atherion_user');
    document.getElementById('userDisplay').textContent = currentUser;
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    loadMails();
}
</script>
